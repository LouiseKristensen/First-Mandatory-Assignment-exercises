<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" type="module"></script>
    <script src="js/navigation.js" type="module"></script>
</head>
<body>
    <header>
        <h1>The Movie Database</h1>
    </header>
    <nav>
        <ul>
            <li><button id="nowPlaying" class="active">Now Playing</button></li>
            <li><button id="popular">Popular</button></li>
            <li><button id="topRated">Top Rated</button></li>
            <li><button id="upcoming">Upcoming</button></li>
        </ul>
    </nav>

    <main>
        <section id="wait">
            <p>Finding the movies</p>
        </section>
        <section id="movieList"></section>

        <template id="movieCards">
            <article class="card">
                <header>
                    <h2></h2>
                </header>
                <section>
                    <div class="imgContainer">
                        <img src="" alt="">
                    </div>
                    <div>
                        <p class="description"></p>
                        <div class="cardInfo">
                            <p class="orgtitle"></p>
                            <p class="releasedate"></p>
                        </div>
                    </div>
                </section>
            </article>
        </template>
    </main>
    <footer>
        <p>&copy; Web development 2025</p>
    </footer>
</body>
</html>
